# Default configuration for the Docker image.
# Serves DNS to every device on every network behind your router.

protection = "strict"

[server]
# "auto" binds every local address, so devices on the 2.4GHz SSID, the 5GHz
# SSID, the guest network and the wired LAN can all reach the resolver.
listen_addresses = ["auto"]
port = 53

[networks]
discover_local = true

[upstream]
servers = [
    "https://dns.quad9.net/dns-query",
    "https://dns.cloudflare.com/dns-query",
    "tls://dns.quad9.net@9.9.9.9",
]
require_encrypted = true
tls_profile = "strict"

[cache]
min_ttl = 300
max_entries = 200000

[dashboard]
enabled = true
# Localhost only. A shipped default password is one nobody changes, and this
# dashboard can switch filtering off and add VPN peers -- so it stays off the
# network until you decide otherwise.
#
# To reach it from another machine, either tunnel in:
#     ssh -L 8080:127.0.0.1:8080 you@this-host
# or expose it properly, with a password of your own:
#     wifiguard passwd            # prints a hash to paste below
#     address = "0.0.0.0"
#     password = "scrypt$..."
address = "127.0.0.1"
port = 8080
